<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>Coffee House</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header__logo">
        <img src="../../assets/img/logo.png" alt="Coffee House Logo">
      </div>
      <nav class="header__nav">
        <ul class="header__nav-list nav-list">
          <li class="nav-list__item"><a href="#">Favorite coffee</a></li>
          <li class="nav-list__item"><a href="#">About</a></li>
          <li class="nav-list__item"><a href="#">Mobile app</a></li>
          <li class="nav-list__item"><a href="#">Contact us</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <button class="header__theme-button theme-button">
          <span class="theme-button__light"></span>
          <span class="theme-button__dark"></span>
        </button>
        <a class="header__menu">
          <span>Menu</span>
          <img src="../../assets/img/coffee-cup.svg" alt="Coffee cup icon">
        </a>
      </div>
    </header>

    <main class="menu">
      <h1 class="menu__title">Behind each of our cups hides an <span class="menu__title_accent">amazing surprise</span></h1>
      <div class="menu__tabs tabs">
        <button class="tabs__item tabs__item_active">
          <div class="tabs__icon">
            <img src="../../assets/img/tabs/coffee.png" alt="Coffee cup">
          </div>
          <span class="tabs__text">Coffee</span>
        </button>
        <button class="tabs__item">
          <div class="tabs__icon">
            <img src="../../assets/img/tabs/tea.png" alt="Teapot">
          </div>
          <span class="tabs__text">Tea</span>
        </button>
        <button class="tabs__item">
          <div class="tabs__icon">
            <img src="../../assets/img/tabs/dessert.png" alt="Cake">
          </div>
          <span class="tabs__text">Dessert</span>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
